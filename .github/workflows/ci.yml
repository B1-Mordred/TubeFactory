name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"
          cache: pip
      - name: Install API and workflow test environments
        run: |
          python -m pip install ./packages/core './services/api[test]' './services/workflow-worker[test]' './services/research-worker[test]'
      - name: Run unit and contract tests
        run: pytest --import-mode=importlib -q packages/core/tests services/api/tests services/workflow-worker/tests services/research-worker/tests

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Type-check
        working-directory: apps/web
        run: npm test
      - name: Production build
        working-directory: apps/web
        run: npm run build

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose topology
        run: docker compose config --quiet
