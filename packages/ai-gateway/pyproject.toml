[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tubefactory-ai-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.14.1",
  "jsonschema==4.25.1",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
