[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tubefactory-research-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.14.1",
  "asyncpg==0.30.0",
  "defusedxml==0.7.1",
  "minio==7.2.15",
  "pypdf==6.14.2",
  "temporalio==1.15.0",
  "trafilatura==2.1.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
