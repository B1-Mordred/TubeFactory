use_default_settings: true

general:
  instance_name: TubeFactory Research
  debug: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "development-only-replace-before-production-7d6b690d"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
  pool_connections: 50
  pool_maxsize: 10
